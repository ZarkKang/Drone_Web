services:
  web:
    build: .
    volumes:
      - .:/app
      - /app/node_modules  # 关键：这行会让容器内部安装好的依赖库“浮”在挂载目录之上
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/drone_db
    depends_on:
      - mongodb

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: